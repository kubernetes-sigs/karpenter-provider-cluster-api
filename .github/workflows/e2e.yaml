name: e2e
on:
  pull_request:
    branches: [ "main" ]
jobs:
  e2e:
    permissions:
      issues: write
    runs-on: ubuntu-latest
    name: e2e
    steps:
      # we sometimes run out of space on the runner after build, this sometimes corrupts the karpenter image build
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # tag=v2.0.0
      with:
        docker-images: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # tag=v7.0.0
      with:
        go-version: '1.25'
    - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # tag=v1.15.0
      with:
        install_only: true
    - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # tag=v0.10
    - name: Setup CAPK management and tenant clusters
      shell: bash
      run: |
        ./test/hack/e2e.sh
      env:
        KIND_CLUSTER_IMAGE: kindest/node:v1.32.8@sha256:abd489f042d2b644e2d033f5c2d900bc707798d075e8186cb65e3f1367a9d5a1
    - name: cleanup 
      shell: bash
      run: | 
        kind delete cluster --name km-cp
        kind delete cluster
